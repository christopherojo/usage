<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ChatGPT Usage</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title-block">
      <div class="title">
        <h1>ChatGPT Usage</h1>
        <span id="plan" class="chip" hidden></span>
      </div>
      <span id="updated" class="muted" role="status" aria-live="polite"></span>
    </div>
    <div class="head-actions">
      <button id="refresh" class="icon-btn" title="Refresh from chatgpt.com" aria-label="Refresh">↻</button>
      <button id="open-dashboard" class="icon-btn" title="Open dashboard" aria-label="Open dashboard">▦</button>
      <button id="open-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <div id="stale" class="stale" hidden>
    <span><b>Update not fully loaded.</b> The toolbar badge is still running older code.</span>
    <button id="reload-ext">Reload extension</button>
  </div>

  <section>
    <div class="row-between">
      <h2>Limits</h2>
      <div id="view-toggle" class="seg" role="group" aria-label="Show limits as">
        <button data-view="used" aria-pressed="true">Used</button>
        <button data-view="left" aria-pressed="false">Left</button>
      </div>
    </div>
    <div id="limits"></div>
    <p id="limits-note" class="note" hidden></p>
  </section>

  <section>
    <h2>Your activity <span class="muted small">(tracked by this extension)</span></h2>
    <div class="stats" id="stats"></div>
    <div id="models" class="models"></div>
  </section>

  <section>
    <div class="row-between">
      <h2>Costliest chats · 7d</h2>
      <a href="#" id="all-chats" class="small link">All chats →</a>
    </div>
    <ol id="top-chats" class="chats"></ol>
  </section>

  <section>
    <div class="row-between">
      <h2>Recent queries</h2>
      <span class="muted small" id="tok-note"></span>
    </div>
    <ol id="queries" class="queries"></ol>
  </section>

  <section>
    <details id="status-box">
      <summary><h2 class="inline">Status</h2> <span id="status-summary" class="muted small"></span></summary>
      <ul id="status" class="status"></ul>
      <div class="status-actions"><button id="copy-diag">Copy diagnostics</button></div>
    </details>
  </section>

  <footer>
    <button id="export-csv">Export CSV</button>
    <button id="export-json">Export JSON</button>
    <button id="clear" class="danger">Clear data</button>
    <span id="version" class="muted small version"></span>
  </footer>

  <script src="../lib/shared.js"></script>
  <script src="../lib/forecast.js"></script>
  <script src="popup.js"></script>
</body>
</html>
